<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đối chứng bộ đo UI — dữ liệu mô phỏng</title>
<link rel="stylesheet" href="/theme.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro",sans-serif}
header{margin:auto auto 12px;max-width:820px;color:var(--muted);font-size:12px}
.card{max-width:820px;margin:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.heading{padding:16px 20px;border-bottom:1px solid var(--line)}h1{font-size:20px;font-weight:600;margin:2px 0 0}.label{font-size:12px;color:var(--muted)}
.money{background:var(--surface-2);padding:16px 20px;display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px}.total{font-size:28px;font-weight:700;white-space:nowrap}.change{color:var(--success);font-weight:600}
.actions{padding:16px 20px;position:relative}button{display:block;width:100%;min-height:44px;border:1px solid var(--primary);border-radius:6px;background:var(--primary);color:var(--primary-ink);font:600 15px "Be Vietnam Pro",sans-serif;cursor:pointer}button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.cover{position:absolute;inset:0;z-index:20;opacity:0;background:white}
@media(max-width:700px){body{padding:8px}.heading,.money,.actions{padding:12px}.total{font-size:24px}}
</style>
<header>ĐỐI CHỨNG BỘ ĐO · KHÔNG PHẢI MÀN ỨNG DỤNG</header>
<main class="card" data-testid="card">
  <section class="heading"><span class="label">THANH TOÁN MÔ PHỎNG</span><h1 data-testid="title">Bàn 12</h1></section>
  <section class="money"><div class="row"><strong>Tổng cộng</strong><span class="total" data-testid="total">185.000 ₫</span></div><div class="row change"><span>Tiền thối</span><span>15.000 ₫</span></div></section>
  <div class="actions"><button data-testid="complete">Hoàn tất</button></div>
</main>
<script>
const mode=new URLSearchParams(location.search).get('mode');
if(mode==='shift')document.querySelector('.card').style.transform='translateX(6px)';
if(mode==='palette')document.documentElement.style.setProperty('--primary','#1D4ED8');
if(mode==='covered'){const cover=document.createElement('div');cover.className='cover';document.querySelector('.actions').append(cover)}
if(mode==='tiny'){const b=document.querySelector('button');Object.assign(b.style,{width:'20px',minHeight:'20px',height:'20px',fontSize:'8px',overflow:'hidden'})}
if(mode==='font')document.body.style.fontFamily='Arial,sans-serif';
if(mode==='overflow')document.body.style.minWidth='1200px';
if(mode==='long')document.querySelector('h1').textContent='Bàn sân vườn — khu vực phục vụ khách đặt trước với tên tiếng Việt dài để kiểm tra xuống dòng';
</script>
</html>
