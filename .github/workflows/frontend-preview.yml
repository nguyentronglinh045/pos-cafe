name: Frontend Preview (manual)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current main commit with successful POS light CI'
        required: true
        type: string
      ci_run_id:
        description: 'Successful push CI run for that exact commit'
        required: true
        type: string
      ci_attempt:
        description: 'Exact successful CI run attempt'
        default: '1'
        required: true
        type: string
      data_mode:
        description: 'Expected Preview data mode; Supabase requires reviewed Preview-only public configuration'
        default: mock
        required: true
        type: choice
        options:
          - mock
          - supabase

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: pos-frontend-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'nguyentronglinh045/pos-cafe' && github.repository_id == '1263057386' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: Preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Verify source, configuration and create frontend Preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/project-preview.mjs deploy
