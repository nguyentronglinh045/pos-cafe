name: POS light CI

on:
  push:
    branches-ignore:
      - docs
      - 'evidence/permission-docs-*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: pos-light-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    name: Build, unit, tooling and mock UI
    if: github.repository == 'nguyentronglinh045/pos-cafe' && github.repository_id == '1263057386'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Run bounded CI and publish safe summary
        run: node scripts/project-ci-launch.mjs
      - name: Validate only the three safe synthetic PIN photos after unit release
        id: pin-ui-export
        if: always()
        run: node scripts/permission-runtime-pin-ui.mjs --export-check
      - name: Retain only reviewed allowlist for PIN visual classification
        if: always() && steps.pin-ui-export.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: permission-pin-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/permission-pin-ui-safe/${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            artifacts/permission-pin-ui-safe/${{ github.run_id }}-${{ github.run_attempt }}/required_pin_change__desktop.png
            artifacts/permission-pin-ui-safe/${{ github.run_id }}-${{ github.run_attempt }}/required_pin_change__tablet.png
            artifacts/permission-pin-ui-safe/${{ github.run_id }}-${{ github.run_attempt }}/required_pin_change__mobile.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
