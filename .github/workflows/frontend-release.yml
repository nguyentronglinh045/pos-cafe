name: Frontend public demo (manual)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current main commit approved for the public staging demo'
        required: true
        type: string
      ci_run_id:
        description: 'Successful POS light CI push run for that source'
        required: true
        type: string
      ci_attempt:
        description: 'Exact CI run attempt'
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: pos-frontend-release
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'nguyentronglinh045/pos-cafe' && github.repository_id == '1263057386' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Verify exact CI source, trusted checker and owner protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/project-release.mjs verify
  approval:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Recheck source after approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/project-release.mjs verify
      - name: Publish the staging demo to its production domain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEMO_CLIENT_KEY: ${{ vars.POS_PUBLIC_DEMO_CLIENT_KEY }}
          DEMO_OTP_KEY: ${{ secrets.POS_PUBLIC_DEMO_OTP_INGRESS_KEY }}
        run: node scripts/project-public-demo.mjs
